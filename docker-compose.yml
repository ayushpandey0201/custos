# [MVP] one-command single-node deployment.
#
# Postgres + Redis + the three Custos processes. For a laptop run with no
# infrastructure at all, use `python -m examples.fintech_demo.run_demo` instead:
# the system falls back to SQLite and an in-process cache.

x-custos-env: &custos-env
  CUSTOS_DATABASE_URL: postgresql+psycopg://custos:custos@postgres:5432/custos
  CUSTOS_REDIS_URL: redis://redis:6379/0

services:
  # Runs Alembic once, then exits. Everything else waits for it to succeed, so
  # no service can ever start against a schema that has not been migrated.
  migrate:
    build: .
    command: alembic upgrade head
    environment: *custos-env
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build: .
    command: uvicorn services.gateway.main:app --host 0.0.0.0 --port 8000
    environment: *custos-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  control:
    build: .
    command: uvicorn services.control.main:app --host 0.0.0.0 --port 8001
    environment: *custos-env
    ports:
      - "8001:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A services.worker.celery_app worker --beat --loglevel=info
    environment: *custos-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: custos
      POSTGRES_USER: custos
      POSTGRES_PASSWORD: custos
    ports:
      - "5432:5432"
    volumes:
      - custos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  custos-pgdata:
