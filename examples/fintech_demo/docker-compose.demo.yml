# Spins up the demo + full Custos stack together
version: "3.9"

services:
  custos-gateway:
    build: ../..
    command: uvicorn services.gateway.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  custos-control:
    build: ../..
    command: uvicorn services.control.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"

