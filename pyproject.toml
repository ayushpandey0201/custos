[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "custos"
version = "0.1.0"
description = "Runtime trust layer for AI agents & models"
requires-python = ">=3.11"

# The core system deliberately carries no scientific-computing stack. PSI and
# KS are implemented in stdlib Python (engines/drift/detectors.py), which keeps
# the gateway image small and the drift maths auditable in one file.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2",
    "sqlalchemy>=2",
    "alembic>=1.13",
]

[project.optional-dependencies]
# Postgres + Redis + Celery. Not needed to run the system on a single node:
# it defaults to SQLite and an in-process cache, and the drift worker is
# directly callable without a broker.
server = [
    "celery>=5.3",
    "redis>=5",
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

# Explicit, because this is a monorepo with several top-level packages and
# setuptools refuses to guess between them. `examples`, `tests` and
# `benchmarks` are deliberately excluded: they are fixtures and instruments,
# not shipped code.
#
# The SDK is not listed here. It is a separate distributable that must stay
# installable on its own — a caller integrating Custos should not have to pull
# in the server to get the client.
[tool.setuptools.packages.find]
include = ["shared*", "engines*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "sdk/python"]
asyncio_mode = "strict"
filterwarnings = [
    # FastAPI's on_event is deprecated in favour of lifespan handlers; the
    # migration is tracked separately and is not worth a noisy test run.
    "ignore::DeprecationWarning:fastapi.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # `Depends(...)` / `Query(...)` in a default argument is the FastAPI
    # dependency-injection idiom, not the mutable-default bug B008 targets.
    "B008",
    # `class Decision(str, Enum)` is deliberate: it serialises predictably
    # through Pydantic v2 and JSON, which StrEnum does not improve on here.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# The deck builder and its content module are mostly slide prose held in string
# literals. Hard-wrapping presentation copy at 100 columns makes it harder to
# read and edit than leaving the sentences intact — whoever opens these files is
# editing English, not code. The line limit still applies everywhere else.
"docs/presentations/build_deck.py" = ["E501"]
"docs/presentations/content.py" = ["E501"]
